  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0d0f;
      color: #f5f2ea;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: 90%;
      max-width: 1150px;
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      gap: 20px;
    }

    .logo {

      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo span {
      display: block;
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 2px;
      opacity: 0.65;
      margin-top: -2px;
    }

    nav {
      display: flex;
      gap: 22px;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    nav a {
      opacity: 0.8;
    }

    nav a:hover {
      opacity: 1;
    }

    .hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:

        radial-gradient(circle at 80% 70%, rgba(80,170,255,0.12), transparent 35%),

    }

    .hero::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      right: -180px;
      top: 50%;
      transform: translateY(-50%);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 50%;
      right: -80px;
      top: 50%;
      transform: translateY(-50%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 780px;
      padding: 90px 0;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 0.72rem;
      opacity: 0.65;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6.8rem);
      line-height: 0.95;
      letter-spacing: -3px;
      margin-bottom: 28px;
    }

    .hero h1 span {
      display: block;
      opacity: 0.55;
      font-size: 0.46em;
      letter-spacing: 1px;
      line-height: 1.2;
      margin-top: 18px;
    }

      max-width: 680px;
      font-size: 1.2rem;
      color: rgba(245,242,234,0.78);
      margin-bottom: 35px;
    }

      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }
