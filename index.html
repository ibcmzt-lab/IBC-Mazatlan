<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Immersive Beverage Concepts | IBC Mazatlán</title>

<meta name="description" content="IBC is a technology-driven beverage discovery environment where people taste, explore, participate and influence what's next.">

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f1e8;
  color: #17201f;
  line-height: 1.6;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  max-width: 100%;
}

.container {
  width: min(1120px, 90%);
  margin: auto;
}


/* =========================
   HEADER
========================= */

.site-header {
  background: #17201f;
  color: #f5f1e8;
  border-bottom: 1px solid rgba(198,161,91,.35);
  position: relative;
  z-index: 10;
}

.header-inner {
  width: min(1120px, 90%);
  min-height: 92px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 15px;
}

.brand-mark {
  width: 48px;
  height: 48px;
  border: 2px solid #c6a15b;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c6a15b;
  font-weight: bold;
  letter-spacing: 1px;
}

.brand-name {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2.5px;
}

.brand-subtitle {
  margin-top: 4px;
  color: #c6a15b;
  font-size: 10px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
}

.language-switch {
  display: flex;
  align-items: center;
  gap: 5px;
}

.language-switch button {
  border: 0;
  background: transparent;
  color: #9d9e98;
  cursor: pointer;
  padding: 5px;
  font-size: 12px;
  letter-spacing: 1px;
}

.language-switch button.active {
  color: #c6a15b;
  font-weight: bold;
}


/* =========================
   HERO
========================= */

.hero {
  background: #17201f;
  color: #f5f1e8;
}

.hero-image {
  width: 100%;
  max-height: 620px;
  object-fit: cover;
}

.hero-content {
  padding: 75px 0 85px;
}

.eyebrow,
.section-label {
  color: #c6a15b;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.eyebrow {
  margin-bottom: 18px;
}

h1 {
  font-size: clamp(48px, 8vw, 92px);
  line-height: .94;
  letter-spacing: -4px;
  margin-bottom: 28px;
  max-width: 950px;
}

.hero-copy {
  max-width: 760px;
  font-size: 20px;
  color: #ddd8cc;
  margin-bottom: 18px;
}

.hero-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 32px;
}

.button {
  display: inline-block;
  padding: 14px 23px;
  border: 1px solid #c6a15b;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.button-primary {
  background: #c6a15b;
  color: #17201f;
}


/* =========================
   PARTICIPATION
========================= */

.participation {
  background: #f5f1e8;
  padding: 105px 0;
}

.intro-grid {
  display: grid;
  grid-template-columns: .9fr 1.4fr;
  gap: 75px;
}

.big-heading {
  font-size: clamp(40px, 6vw, 70px);
  line-height: .96;
  letter-spacing: -3px;
  margin-top: 12px;
}

.lead {
  font-size: 22px;
  color: #424946;
  margin-bottom: 25px;
}

.body-copy {
  color: #626864;
  font-size: 17px;
  margin-bottom: 18px;
}


/* =========================
   THREE WAYS
========================= */

.ways {
  background: #e9e3d7;
  padding: 100px 0;
}

.section-heading {
  max-width: 760px;
  margin-bottom: 55px;
}

.section-heading h2 {
  font-size: clamp(40px, 6vw, 68px);
  line-height: .96;
  letter-spacing: -3px;
  margin: 12px 0 20px;
}

.section-heading p {
  font-size: 18px;
  color: #5a605d;
}

.ways-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.way-card {
  background: #f8f5ee;
  border: 1px solid #d4cdbf;
  padding: 38px;
  min-height: 270px;
}

.way-icon {
  color: #c6a15b;
  font-size: 30px;
  margin-bottom: 35px;
}

.way-card h3 {
  font-size: 25px;
  margin-bottom: 15px;
}

.way-card p {
  color: #626864;
}


/* =========================
   TECHNOLOGY
========================= */

.technology {
  background: #17201f;
  color: #f5f1e8;
  padding: 105px 0;
}

.technology .section-heading p {
  color: #c9c7be;
}

.tech-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.tech-card {
  border: 1px solid rgba(198,161,91,.35);
  padding: 30px;
  min-height: 245px;
}

.tech-number {
  color: #c6a15b;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 35px;
}

.tech-card h3 {
  font-size: 21px;
  margin-bottom: 12px;
}

.tech-card p {
  color: #bdbdb5;
  font-size: 15px;
}


/* =========================
   PULSE
========================= */

.pulse {
  padding: 105px 0;
  background: #f5f1e8;
}

.pulse-layout {
  display: grid;
  grid-template-columns: .9fr 1.3fr;
  gap: 70px;
  align-items: start;
}

.pulse-heading h2 {
  font-size: clamp(40px, 6vw, 65px);
  line-height: .95;
  letter-spacing: -3px;
  margin: 12px 0 22px;
}

.pulse-heading p {
  color: #5c625f;
  font-size: 18px;
}

.pulse-board {
  background: #17201f;
  color: #f5f1e8;
  padding: 32px;
  border: 1px solid #c6a15b;
}

.pulse-title {
  color: #c6a15b;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.pulse-row {
  display: grid;
  grid-template-columns: 1fr 90px 70px;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,.12);
  padding: 16px 0;
}

.pulse-name {
  font-size: 16px;
}

.pulse-value {
  text-align: right;
  font-weight: bold;
}

.pulse-trend {
  text-align: right;
  color: #c6a15b;
  font-weight: bold;
}

.pulse-note {
  margin-top: 25px;
  color: #aaa;
  font-size: 12px;
}


/* =========================
   LAB
========================= */

.lab {
  background: #e9e3d7;
  padding: 105px 0;
}

.lab-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
}

.lab-card {
  background: #f8f5ee;
  padding: 42px;
  border: 1px solid #d3ccbd;
}

.lab-card h3 {
  font-size: 28px;
  margin-bottom: 15px;
}

.lab-card p {
  color: #5d635f;
}

.lab-flow {
  margin-top: 35px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.flow-item {
  padding: 9px 12px;
  border: 1px solid #c6a15b;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
}


/* =========================
   COMMUNITY
========================= */

.community {
  background: #c6a15b;
  color: #17201
